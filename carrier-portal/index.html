<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7f7f5" />
  <meta name="description" content="Bus Cargo Agents — mizigo ya basi. Simamia kwa urahisi." />
  <title>Bus Cargo Agents</title>
  <link rel="icon" href="./assets/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=20261031p" />
</head>
<body class="auth-boot">
  <div id="public">
    <header class="public-nav">
      <a class="mark" href="#/">
        <img src="./assets/logo.svg" alt="" width="28" height="28" />
        <span>Bus Cargo Agents</span>
      </a>
    </header>

    <section class="hero" id="landing">
      <div class="hero-inner">
        <div class="hero-copy">
          <h1>Mizigo ya basi, kwa utaratibu.</h1>
          <p class="subline">Simamia kwa urahisi.</p>
          <div class="hero-cta">
            <button class="btn primary" id="heroCta" type="button">Anza sasa</button>
            <button class="btn line" id="heroRegister" type="button">Jisajili</button>
          </div>
          <p class="hero-ingress">
            <button class="btn link quiet" id="quietLogin" type="button">Ingia</button>
          </p>
        </div>
        <div class="hero-carousel" id="heroCarousel" aria-hidden="true">
          <figure class="hero-slide is-active" data-hero-slide="0">
            <img src="./assets/hero-pokea-oda.jpg?v=20261005m" alt="" width="320" height="320" loading="eager" decoding="async" />
            <figcaption>Pokea oda</figcaption>
          </figure>
          <figure class="hero-slide" data-hero-slide="1">
            <img src="./assets/hero-simamia-mzigo.jpg?v=20261005m" alt="" width="320" height="320" loading="lazy" decoding="async" />
            <figcaption>Simamia mzigo</figcaption>
          </figure>
          <figure class="hero-slide" data-hero-slide="2">
            <img src="./assets/hero-toa-risiti.jpg?v=20261005m" alt="" width="320" height="320" loading="lazy" decoding="async" />
            <figcaption>Toa risiti</figcaption>
          </figure>
        </div>
      </div>
    </section>

    <footer class="public-footer">
      <button class="btn link quiet" id="footerLogin" type="button">Ingia</button>
      <span class="footer-dot" aria-hidden="true">·</span>
      <button class="btn link quiet" id="footerRegister" type="button">Jisajili</button>
    </footer>

    <section class="auth-shell hidden" id="authCard">
      <div class="auth-panel">
        <h2 id="authTitle">Ingia</h2>
        <p class="auth-lead" id="authLead">Fungua dashibodi ya kampuni yako.</p>
        <form id="authForm">
          <div id="registerFields" class="hidden">
            <div class="reg-step" data-reg-step="1">
              <label>Jina la kampuni</label>
              <input name="companyName" placeholder="Abood Bus" autocomplete="organization" />
              <div class="form-grid">
                <div>
                  <label>Mwasiliani</label>
                  <input name="contactPerson" autocomplete="name" />
                </div>
                <div>
                  <label>Simu</label>
                  <input name="phone" placeholder="07…" inputmode="tel" autocomplete="tel" />
                </div>
              </div>
              <label>Mahali pa ofisi</label>
              <input name="location" placeholder="Kariakoo, Dar es Salaam" autocomplete="address-line1" />
              <input type="hidden" name="businessDetails" value="" />
            </div>
            <div class="reg-step hidden" data-reg-step="2">
              <p class="step-label">Mkoa wa makao</p>
              <label for="regRegion">Mkoa kampuni ilipo</label>
              <input id="regRegion" name="region" placeholder="Dar es Salaam" />
              <p class="muted">Oda zinazotoka mkoa huu pekee. Coverage (mikoa yote, mikoa maalum, au ndani ya mji) unaweka baadaye.</p>
              <div class="reg-nav">
                <button class="btn ghost reg-back" type="button" data-reg-back="1">Rudi</button>
              </div>
            </div>
            <div class="reg-step hidden" data-reg-step="3">
              <label>Barua pepe ya kazi</label>
              <input name="email" type="email" autocomplete="username" required />
              <label>Nenosiri</label>
              <div class="password-wrap">
                <input name="password" type="password" autocomplete="new-password" minlength="6" required data-password />
                <button class="password-toggle" type="button" data-toggle-password aria-label="Onyesha nenosiri">Onyesha</button>
              </div>
            </div>
          </div>
          <div id="loginFields">
            <label for="loginEmail">Barua pepe</label>
            <input id="loginEmail" name="email" type="email" autocomplete="username" required />
            <label for="loginPassword">Nenosiri</label>
            <div class="password-wrap">
              <input id="loginPassword" name="password" type="password" autocomplete="current-password" minlength="6" required data-password />
              <button class="password-toggle" type="button" data-toggle-password aria-label="Onyesha nenosiri">Onyesha</button>
            </div>
            <button class="btn link" id="forgotPassword" type="button">Umesahau nenosiri?</button>
          </div>
          <p class="form-success hidden" id="authSuccess"></p>
          <p class="form-error" id="authError" role="alert"></p>
          <button class="btn primary" type="submit" id="authSubmit">Ingia</button>
          <button class="btn ghost" type="button" id="authSwitch">Huna akaunti?</button>
        </form>
      </div>
    </section>
  </div>

  <div id="app" class="hidden">
    <div class="shell">
      <button class="nav-scrim" id="navScrim" type="button" aria-label="Funga menyu"></button>
      <aside class="sidebar" id="sidebar">
        <div class="side-head">
          <a class="mark" href="#/overview">
            <img src="./assets/logo.svg" alt="" width="28" height="28" />
            <span>Bus Cargo Agents</span>
          </a>
          <button class="nav-close" id="navClose" type="button" aria-label="Funga menyu">×</button>
        </div>
        <div id="nav"></div>
      </aside>
      <main class="main">
        <div class="topbar">
          <div class="topbar-title">
            <button class="menu-btn" id="menuBtn" type="button" aria-label="Fungua menyu" aria-expanded="false" aria-controls="sidebar">
              <span class="menu-bars" aria-hidden="true"><i></i><i></i><i></i></span>
            </button>
            <h1 id="pageTitle">Muhtasari</h1>
          </div>
          <div class="who">
            <strong id="companyLabel">Kampuni</strong>
            <span class="status-dot" id="statusLabel"></span>
            <button class="btn ghost small" id="signOutBtn" type="button">Toka</button>
          </div>
        </div>
        <div id="view"></div>
      </main>
    </div>
  </div>

  <script type="module" src="./app.js?v=20261031p"></script>
</body>
</html>
