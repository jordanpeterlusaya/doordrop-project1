<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DoorDrop Admin</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
  <meta name="theme-color" content="#16a34a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5f7f8;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --surface-muted: #eef2f6;
      --ink: #0b1220;
      --ink-soft: #334155;
      --muted: #64748b;
      --line: #e8edf2;
      --line-soft: #f1f5f9;
      --green: #16a34a;
      --green-dark: #166534;
      --green-soft: #dcfce7;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --amber: #c2410c;
      --amber-soft: #fff7ed;
      --red: #dc2626;
      --red-soft: #fef2f2;
      --purple: #6d28d9;
      --purple-soft: #f5f3ff;
      --sidebar-bg: #0f172a;
      --sidebar-bg-soft: #1e293b;
      --sidebar-ink: #f8fafc;
      --sidebar-muted: #94a3b8;
      --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.03), 0 4px 16px rgba(15, 23, 42, 0.04);
      --shadow-lg: 0 24px 60px rgba(15, 23, 42, 0.12);
      --radius: 14px;
      --radius-sm: 10px;
      --sidebar: 260px;
      --drawer: 400px;
      --topbar: 72px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      font-family: 'Manrope', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
      background: var(--bg);
      letter-spacing: 0;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    h1,
    h2,
    h3,
    strong {
      margin: 0;
      font-family: 'Manrope', system-ui, sans-serif;
      letter-spacing: -0.03em;
      font-weight: 700;
    }

    p {
      margin: 0;
    }

    .hidden {
      display: none !important;
    }

    .admin-auth-overlay {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(22, 163, 74, 0.12), transparent 36%),
        linear-gradient(180deg, #f7faf8 0%, #eef3f0 100%);
    }

    .admin-auth-card {
      width: min(420px, 100%);
      padding: 32px;
      display: grid;
      gap: 16px;
      border-radius: 24px;
      background: #ffffff;
      border: 1px solid var(--line);
      box-shadow: var(--shadow-lg);
    }

    .auth-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .auth-brand strong {
      display: block;
      font-size: 0.98rem;
    }

    .auth-brand small {
      display: block;
      margin-top: 1px;
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 600;
    }

    .admin-auth-card h2 {
      font-size: 1.55rem;
      line-height: 1.15;
      color: var(--ink);
    }

    .admin-auth-card > .muted {
      margin-top: -6px;
    }

    .admin-auth-tabs,
    .admin-auth-actions,
    .admin-inline-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .admin-auth-actions {
      display: grid;
    }

    .admin-auth-actions .btn {
      width: 100%;
      min-height: 44px;
    }

    .auth-email-hint {
      margin-top: -8px;
    }

    .auth-feedback {
      margin: 0;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.4;
    }

    .auth-feedback.error {
      color: #be123c;
      background: #fff0f0;
      border: 1px solid #fecdd3;
    }

    .auth-feedback.success {
      color: #047857;
      background: #e9fbf3;
      border: 1px solid #bbf7d0;
    }

    .admin-auth-card .form-grid {
      grid-template-columns: 1fr;
    }

    .app-shell {
      height: 100vh;
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
      overflow: hidden;
    }

    .sidebar {
      min-width: 0;
      height: 100vh;
      padding: 18px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: auto;
      background: var(--sidebar-bg);
      color: var(--sidebar-ink);
      border-right: 0;
      z-index: 30;
    }

    .brand {
      padding: 6px 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      margin-bottom: 4px;
    }

    .brand-logo,
    .auth-logo {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: var(--shadow-xs);
    }

    .auth-logo {
      width: 52px;
      height: 52px;
      border-radius: 14px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 12px;
      background: var(--green);
      color: #fff;
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .brand strong {
      font-size: 0.98rem;
      color: var(--sidebar-ink);
    }

    .brand small {
      display: block;
      margin-top: 1px;
      color: var(--sidebar-muted);
      font-size: 0.74rem;
      font-weight: 600;
    }

    .nav-section {
      display: grid;
      gap: 3px;
    }

    .nav-title {
      padding: 12px 12px 6px;
      color: #64748b;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .nav-link {
      width: 100%;
      min-height: 40px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 11px;
      border-radius: 12px;
      color: #cbd5e1;
      background: transparent;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: left;
      transition: background 140ms ease, color 140ms ease;
    }

    .nav-link:hover {
      color: #fff;
      background: rgba(148, 163, 184, 0.12);
    }

    .nav-link.active {
      color: #fff;
      background: rgba(22, 163, 74, 0.22);
      box-shadow: inset 3px 0 0 var(--green);
    }

    .nav-icon {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: currentColor;
    }

    .nav-icon svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sidebar-card {
      margin-top: 4px;
      padding: 14px;
      display: grid;
      gap: 8px;
      border-radius: var(--radius);
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.16);
    }

    .sidebar-lookup {
      padding: 14px;
      display: grid;
      gap: 10px;
      border-radius: var(--radius);
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.16);
    }

    .sidebar-lookup label {
      color: var(--sidebar-muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .sidebar-lookup-row {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }

    .sidebar-lookup input {
      width: 100%;
      min-width: 0;
      height: 40px;
      padding: 0 12px;
      border-radius: 12px;
      color: var(--sidebar-ink);
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.22);
      outline: 0;
      font-weight: 500;
    }

    .sidebar-lookup input::placeholder {
      color: #64748b;
    }

    .sidebar-lookup input:focus {
      border-color: rgba(22, 163, 74, 0.55);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.18);
    }

    .sidebar-lookup button {
      min-width: 52px;
      height: 40px;
      padding: 0 12px;
      border-radius: 12px;
      color: #fff;
      background: var(--green);
      font-weight: 700;
    }

    .sidebar-lookup p {
      color: var(--sidebar-muted);
      font-size: 0.78rem;
      line-height: 1.45;
    }

    .sidebar-card p,
    .sidebar-card a {
      color: var(--sidebar-muted);
      line-height: 1.5;
      font-size: 0.86rem;
    }

    .sidebar-card a {
      font-weight: 700;
      color: #e2e8f0;
    }

    .sidebar-card a:hover {
      color: #fff;
    }

    .sidebar-profile {
      margin-top: auto;
      padding: 12px;
      display: grid;
      grid-template-columns: 40px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      border-radius: 14px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.16);
    }

    .sidebar-avatar {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: rgba(22, 163, 74, 0.2);
      color: #86efac;
      font-size: 0.82rem;
      font-weight: 800;
    }

    .sidebar-profile strong {
      display: block;
      color: #f8fafc;
      font-size: 0.86rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sidebar-profile small {
      display: block;
      margin-top: 2px;
      color: var(--sidebar-muted);
      font-size: 0.72rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sidebar .pill.success {
      color: #bbf7d0;
      background: rgba(22, 163, 74, 0.18);
    }

    .sidebar .pill.warning {
      color: #fde68a;
      background: rgba(245, 158, 11, 0.16);
    }

    .sidebar .pill.danger {
      color: #fecaca;
      background: rgba(239, 68, 68, 0.16);
    }

    .sidebar .pill.neutral {
      color: #e2e8f0;
      background: rgba(148, 163, 184, 0.16);
    }

    .main-shell {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: var(--topbar) minmax(0, 1fr);
      overflow: hidden;
    }

    .topbar {
      min-width: 0;
      height: var(--topbar);
      padding: 0 28px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
      background: #ffffff;
      border-bottom: 1px solid var(--line);
      box-shadow: none;
      z-index: 20;
    }

    .page-title {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .page-title h1 {
      overflow: hidden;
      color: var(--ink);
      font-size: 1.35rem;
      letter-spacing: -0.04em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .page-title p {
      overflow: hidden;
      color: var(--muted);
      font-size: 0.84rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .topbar-actions {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    .search {
      width: min(340px, 32vw);
      min-width: 200px;
      height: 42px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 9px;
      border-radius: 12px;
      background: var(--surface-soft);
      border: 1px solid var(--line);
      box-shadow: none;
      color: var(--muted);
    }

    .search:focus-within {
      border-color: #86efac;
      box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.12);
    }

    .search input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
    }

    .pill {
      min-height: 28px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .pill.success { color: #15803d; background: #dcfce7; }
    .pill.warning { color: #b45309; background: #ffedd5; }
    .pill.info { color: #1d4ed8; background: #dbeafe; }
    .pill.danger { color: #b91c1c; background: #fee2e2; }
    .pill.neutral { color: var(--ink-soft); background: var(--surface-muted); }
    .pill.purple { color: var(--purple); background: var(--purple-soft); }
    .pill.soft { color: var(--ink-soft); background: #f1f5f9; }

    .btn {
      min-height: 40px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      transition: background 140ms ease, box-shadow 140ms ease, transform 140ms ease;
    }

    .btn:hover {
      transform: none;
    }

    .btn.primary {
      color: #fff;
      background: var(--green);
      box-shadow: 0 1px 2px rgba(22, 163, 74, 0.18);
    }

    .btn.primary:hover {
      background: #15803d;
    }

    .btn.dark {
      color: #fff;
      background: var(--ink);
    }

    .btn.soft {
      color: var(--ink-soft);
      background: #fff;
      border: 1px solid var(--line);
    }

    .btn.soft:hover {
      background: var(--surface-soft);
    }

    .admin-auth-tabs .btn.active {
      color: #fff;
      background: var(--green);
      border-color: var(--green);
    }

    .mobile-menu {
      display: none;
      width: fit-content;
      margin-bottom: 6px;
    }

    .content {
      min-width: 0;
      min-height: 0;
      padding: 24px 28px 32px;
      overflow: auto;
      background: var(--bg);
    }

    .page-panel {
      display: grid;
      gap: 16px;
    }

    .page-panel > .card:has(> .table-wrap) {
      padding: 0;
      overflow: hidden;
      gap: 0;
    }

    .page-panel > .card:has(> .table-wrap) > .table-toolbar,
    .page-panel > .card:has(> .table-wrap) > .card-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line-soft);
      background: #fff;
    }

    .page-panel > .card:has(> .table-wrap) > .table-wrap {
      border: 0;
      border-radius: 0;
    }

    @media (min-width: 1281px) {
      .content.has-drawer {
        padding-right: calc(var(--drawer) + 42px);
      }
    }

    .section {
      display: none;
      min-width: 0;
    }

    .section.active {
      display: grid;
      gap: 20px;
    }

    .hero {
      min-width: 0;
      padding: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      border-radius: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .hero > div:first-child > .eyebrow,
    .hero > div:first-child > h2,
    .hero > div:first-child > p {
      display: none;
    }

    .hero:not(:has(.hero-meta, .hero-card, .btn, .admin-inline-actions)) {
      display: none;
    }

    .hero h2 {
      margin: 0;
      color: var(--ink);
      font-size: 1.15rem;
      line-height: 1.2;
    }

    .hero p {
      max-width: 76ch;
      color: var(--muted);
      line-height: 1.5;
      font-size: 0.9rem;
    }

    .hero-meta,
    .admin-inline-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .hero-meta {
      margin-top: 0;
    }

    .hero-card {
      width: 280px;
      padding: 16px;
      display: grid;
      gap: 11px;
      border-radius: 14px;
      background: #ffffff;
      border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
    }

    .hero-card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--ink-soft);
      font-weight: 650;
      font-size: 0.88rem;
    }

    .grid,
    .list-stack,
    .detail-list {
      min-width: 0;
      display: grid;
      gap: 14px;
    }

    .grid.kpi {
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    }

    .action-required-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    .action-required-item {
      display: grid;
      gap: 6px;
      text-align: left;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .action-required-item:hover {
      border-color: #cbd5e1;
      box-shadow: var(--shadow-sm);
    }

    .action-required-item strong {
      font-size: 1.6rem;
      line-height: 1;
      color: var(--ink);
    }

    .action-required-item span {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.35;
    }

    .api-health-banner {
      border-color: #fecaca;
      background: linear-gradient(180deg, #fff5f5 0%, #fff 100%);
      margin-bottom: 16px;
    }

    .api-health-banner .list-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .ops-attention-counts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .ops-attention-chip {
      display: grid;
      gap: 4px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      text-align: left;
      cursor: pointer;
    }

    .ops-attention-chip strong {
      font-size: 1.1rem;
    }

    .ops-attention-chip.danger { border-color: #fecaca; background: #fff5f5; }
    .ops-attention-chip.warning { border-color: #fed7aa; background: #fff7ed; }
    .ops-attention-chip.amber { border-color: #fde68a; background: #fffbeb; }

    .ops-pipeline-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .ops-pipeline-item {
      display: grid;
      gap: 4px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--surface-soft);
      text-align: left;
      cursor: pointer;
    }

    .ops-pipeline-item strong {
      font-size: 1.4rem;
    }

    .ops-vertical-timeline {
      display: grid;
      gap: 0;
      margin-top: 18px;
      border-left: 2px solid var(--line);
      margin-left: 12px;
      padding-left: 18px;
    }

    .ops-timeline-node {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px;
      padding-bottom: 18px;
      position: relative;
    }

    .ops-timeline-dot {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: var(--green-soft);
      color: var(--green-dark);
      font-size: 0.75rem;
      font-weight: 800;
      margin-left: -31px;
      border: 2px solid #fff;
    }

    .ops-attention-row,
    .list-card.ops-attention-row {
      width: 100%;
      text-align: left;
    }

    @media (max-width: 900px) {
      .ops-pipeline-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .ops-attention-counts {
        grid-template-columns: 1fr;
      }
      .shipment-lifecycle {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .shipment-grid-two,
      .shipment-hero {
        grid-template-columns: 1fr;
      }
    }

    .shipment-page { display: grid; gap: 18px; }
    .shipment-page-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .shipment-hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr); gap: 20px; padding: 22px; }
    .shipment-title { margin: 4px 0 8px; font-size: 1.6rem; }
    .shipment-hero-badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .shipment-hero-metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .shipment-alert { padding: 14px 18px; border-radius: 12px; border: 1px solid var(--line); }
    .shipment-alert.danger { background: #fef2f2; border-color: #fecaca; }

      display: grid;
      grid-template-columns: minmax(260px, 340px) minmax(280px, 1fr);
      gap: 12px;
      align-items: end;

    .dispatch-side-card {
      max-height: min(42vh, 420px);
      overflow: auto;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(10px);
      pointer-events: auto;

        grid-template-columns: 1fr;

      .dispatch-board {
        height: auto;
        min-height: 720px;
      }

      .dispatch-map-stage {
        min-height: 720px;
      }

    .table-wrap {

      overflow: auto;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .cash-num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    table {
      width: 100%;
      min-width: 860px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 16px 18px;
      text-align: left;
      vertical-align: middle;
      border-bottom: 1px solid var(--line-soft);
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      color: #64748b;
      background: #fafbfc;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    td {
      color: var(--ink-soft);
      font-size: 0.9rem;
    }

    tbody tr[data-order] {
      cursor: pointer;
    }

    tbody tr:hover {
      background: #f8fafc;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .order-id {
      color: var(--ink);
      font-weight: 700;
    }

    .person {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .person strong {
      color: var(--ink);
      font-family: 'Manrope', system-ui, sans-serif;
      letter-spacing: 0;
    }

    .map-placeholder {
      min-height: 330px;
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      background:
        linear-gradient(90deg, rgba(37, 99, 235, 0.08) 1px, transparent 1px),
        linear-gradient(rgba(15, 159, 110, 0.08) 1px, transparent 1px),
        #eef6f8;
      background-size: 54px 54px, 54px 54px, cover;
      border: 1px solid var(--line);
    }

    .map-route {
      position: absolute;
      left: 12%;
      top: 48%;
      width: 74%;
      height: 4px;
      border-radius: 999px;
      background: var(--blue);
      transform: rotate(-8deg);
    }

    .map-pin {
      position: absolute;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: var(--radius);
      color: #fff;
      box-shadow: var(--shadow-sm);
    }

    .map-pin span {
      font-weight: 800;
    }

    .pin-a { left: 12%; top: 52%; background: var(--green); }
    .pin-b { right: 14%; top: 31%; background: var(--blue); }
    .pin-c { left: 48%; top: 24%; background: var(--amber); }

    .map-panel-caption {
      position: absolute;
      left: 16px;
      bottom: 16px;
      width: min(370px, calc(100% - 32px));
      padding: 14px;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-sm);
    }

    .map-meta-grid {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .map-meta-chip {
      width: fit-content;
      max-width: 100%;
      padding: 7px 9px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: var(--radius);
      color: var(--ink-soft);
      background: var(--surface-soft);
      border: 1px solid var(--line-soft);
      font-size: 0.78rem;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .list-card {
      width: 100%;
      min-width: 0;
      padding: 13px;
      display: grid;
      gap: 9px;
      border-radius: var(--radius);
      border: 1px solid var(--line-soft);
      background: var(--surface-soft);
      color: inherit;
      text-align: left;
    }

    button.list-card:hover {
      background: #fff;
      border-color: var(--line);
    }

    .list-head strong,
    .list-head span,
    .list-card p {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .progress {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--surface-muted);
    }

    .progress span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--green);
    }

    .order-drawer {
      position: fixed;
      top: calc(var(--topbar) + 18px);
      right: 18px;
      bottom: 18px;
      width: var(--drawer);
      z-index: 25;
      grid-template-rows: auto minmax(0, 1fr) auto;
      overflow: hidden;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--line-soft);
      box-shadow: var(--shadow-lg);
    }

    .drawer-head {
      padding: 18px;
      display: grid;
      gap: 14px;
      border-bottom: 1px solid var(--line-soft);
      background: var(--surface-soft);
    }

    .drawer-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .drawer-close {
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      border-radius: var(--radius);
      background: var(--surface-muted);
      color: var(--ink-soft);
      font-weight: 800;
    }

    .drawer-body {
      min-height: 0;
      padding: 16px 18px;
      display: grid;
      align-content: start;
      gap: 14px;
      overflow: auto;
    }

    .drawer-section {
      display: grid;
      gap: 10px;
    }

    .drawer-section-title {
      color: var(--ink);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .detail-row {
      padding: 12px;
      display: grid;
      gap: 4px;
      border-radius: var(--radius);
      background: var(--surface-soft);
      border: 1px solid var(--line-soft);
    }

    .detail-row label {
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .detail-row p {
      color: var(--ink);
      font-weight: 800;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .drawer-actions {
      padding: 14px 18px 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      border-top: 1px solid var(--line-soft);
      background: var(--surface);
    }

    .drawer-actions .primary {
      grid-column: 1 / -1;
    }

    .quick-grid {
      min-width: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .quick-card {
      min-width: 0;
      padding: 12px;
      display: grid;
      gap: 5px;
      border-radius: var(--radius);
      background: var(--surface-soft);
      border: 1px solid var(--line-soft);
    }

    .quick-card span {
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 900;
    }

    .quick-card strong {
      color: var(--ink);
      font-size: 1rem;
      overflow-wrap: anywhere;
    }

    .timeline {
      position: relative;
      display: grid;
      gap: 14px;
    }

    .timeline-item {
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      gap: 10px;
    }

    .dot {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      color: #fff;
      background: var(--green);
      font-size: 0.78rem;
      font-weight: 800;
    }

    .dot.pending {
      background: #94a3b8;
    }

    .timeline-body {
      min-width: 0;
    }

    .timeline-body strong {
      display: block;
      color: var(--ink);
      font-size: 0.9rem;
    }

    .timeline-body p {
      margin-top: 2px;
      color: var(--muted);
      font-size: 0.83rem;
      line-height: 1.45;
    }

    .avatar-row {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .avatar {
      color: #fff;
      background: var(--blue);
    }

    .form-grid {
      min-width: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .field {
      min-width: 0;
      display: grid;
      gap: 7px;
    }

    .field label {
      color: var(--ink-soft);
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.35;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      min-height: 44px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      outline: 0;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: #86efac;
      box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.12);
    }

    .field textarea {
      min-height: 92px;
      padding-top: 11px;
      resize: vertical;
    }

    .field small,
    .admin-helper-text {
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.45;
    }

    .span-2 {
      grid-column: span 2;
    }

    .empty-state {
      padding: 14px;
      border-radius: var(--radius);
      border: 1px dashed var(--line);
      color: var(--muted);
      background: var(--surface-soft);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .sidebar-scrim {
      display: none;
    }

    .table-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 0;
    }

    .table-toolbar h3 {
      font-size: 0.98rem;
    }

    .table-toolbar + .table-toolbar {
      margin-top: -4px;
      padding-top: 0;
    }

    .context-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: none;
    }

    .page-note {
      min-width: 0;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.45;
    }

    .settings-card {
      max-width: none;
    }

    .table-wrap .btn {
      min-height: 34px;
      padding: 0 12px;
      font-size: 0.82rem;
    }

    .person .pill,
    td .pill {
      margin-right: 6px;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-chip {
      min-height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      color: var(--ink-soft);
      background: #fff;
      border: 1px solid var(--line);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .filter-chip:hover {
      background: var(--surface-soft);
    }

    .filter-chip.active {
      color: #fff;
      background: var(--green);
      border-color: var(--green);
    }

    .chart {
      display: grid;
      gap: 12px;
    }

    .bar-row {
      display: grid;
      gap: 6px;
    }

    .bar-row-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--ink-soft);
      font-size: 0.86rem;
      font-weight: 600;
    }

    .bar-row-meta strong {
      font-variant-numeric: tabular-nums;
      letter-spacing: 0;
    }

    .bar-track {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--surface-muted);
    }

    .bar-fill {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--green);
    }

    .bar-fill.blue { background: var(--blue); }
    .bar-fill.amber { background: #ea580c; }
    .bar-fill.red { background: var(--red); }
    .bar-fill.slate { background: #94a3b8; }

    .kpi-card {
      position: relative;
      padding-left: 24px;
    }

    .kpi-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 14px;
      bottom: 14px;
      width: 3px;
      border-radius: 999px;
      background: var(--green);
    }

    @media (max-width: 1280px) {
      .grid.two,
      .grid.three {
        grid-template-columns: 1fr;
      }

      .order-drawer {
        top: auto;
        left: 18px;
        right: 18px;
        bottom: 18px;
        width: auto;
        max-height: 78vh;
      }
    }

    @media (max-width: 980px) {
      body {
        overflow: auto;
      }

      .app-shell {
        height: auto;
        min-height: 100vh;
        grid-template-columns: 1fr;
        overflow: visible;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: min(300px, 86vw);
        transform: translateX(-105%);
        transition: transform 180ms ease;
        box-shadow: var(--shadow-lg);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-scrim {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 28;
        background: rgba(15, 23, 42, 0.36);
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
      }

      .sidebar.open ~ .main-shell .sidebar-scrim,
      body:has(.sidebar.open) .sidebar-scrim {
        opacity: 1;
        pointer-events: auto;
      }

      .mobile-menu {
        display: inline-flex;
      }

      .main-shell {
        min-height: 100vh;
      }

      .topbar {
        height: auto;
        min-height: var(--topbar);
        grid-template-columns: 1fr;
        align-items: start;
        padding: 14px;
      }

      .topbar-actions {
        justify-content: flex-start;
        flex-wrap: wrap;
      }

      .search {
        width: 100%;
        min-width: 0;
      }

      .page-title h1,
      .page-title p {
        white-space: normal;
      }

      .hero {
        grid-template-columns: 1fr;
      }

      .hero-card {
        width: 100%;
      }
    }

    @media (max-width: 640px) {
      .content {
        padding: 14px;
      }

      .grid.kpi,
      .service-grid,
      .staff-grid,
      .quick-grid,
      .form-grid,
      .fact-grid {
        grid-template-columns: 1fr;
      }

      .span-2 {
        grid-column: auto;
      }

      .drawer-actions {
        grid-template-columns: 1fr;
      }

      .order-drawer {
        left: 10px;
        right: 10px;
        bottom: 10px;
        max-height: 84vh;
      }
    }
  </style>
</head>
